[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-behavior-lab"
version = "0.1.0"
description = "Reproducible experiments studying social influence and behavioral stability in AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kai Indigo Wolf" }]
dependencies = [
  "inspect-ai>=0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_behavior_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
